name: Bug report
description: Report a reproducible problem in mysh
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include real credentials, private hostnames, or unmasked personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: mysh ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest command/config example that reproduces the issue.
      placeholder: |
        1. Run `mysh ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mysh version
      placeholder: mysh version or release tag
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or notes. Redact secrets and personal data.
