name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: go

  build-release:
    name: Build Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: mysh-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: mysh-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: mysh-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: mysh-darwin-arm64
          - goos: windows
            goarch: amd64
            asset_name: mysh-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset_name: mysh-windows-arm64.exe
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          VERSION="${VERSION#v}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.version=${VERSION}" \
            -o ${{ matrix.asset_name }} .
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            ${{ matrix.asset_name }}

  build-msi:
    name: Build MSI Installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        # MSI assets use winget's architecture tokens (x64/arm64) so that
        # winget-releaser detects the architecture from the file name.
        include:
          - goarch: amd64
            wix_arch: x64
            exe: mysh-windows-amd64.exe
            msi: mysh-windows-x64.msi
          - goarch: arm64
            wix_arch: arm64
            exe: mysh-windows-arm64.exe
            msi: mysh-windows-arm64.msi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build executable
        env:
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $Version = $env:VERSION.TrimStart('v')
          go build -ldflags "-X main.version=$Version" -o ${{ matrix.exe }} .
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
      - name: Build MSI
        shell: pwsh
        run: |
          $Version = "${{ needs.release-please.outputs.tag_name }}".TrimStart('v')
          wix build build/windows/mysh.wxs `
            -arch ${{ matrix.wix_arch }} `
            -d Version=$Version `
            -d ExeSource=${{ matrix.exe }} `
            -bindpath build/windows `
            -ext WixToolset.UI.wixext `
            -o ${{ matrix.msi }}
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ matrix.msi }}

  publish-homebrew:
    name: Update Homebrew Formula
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: atani/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo atani/mysh --pattern "mysh-*"

          DARWIN_AMD64_SHA=$(sha256sum mysh-darwin-amd64 | cut -d' ' -f1)
          DARWIN_ARM64_SHA=$(sha256sum mysh-darwin-arm64 | cut -d' ' -f1)
          LINUX_AMD64_SHA=$(sha256sum mysh-linux-amd64 | cut -d' ' -f1)
          LINUX_ARM64_SHA=$(sha256sum mysh-linux-arm64 | cut -d' ' -f1)

          cat > homebrew-tap/Formula/mysh.rb << FORMULA
          class Mysh < Formula
            desc "MySQL connection manager with SSH tunnel support"
            homepage "https://github.com/atani/mysh"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/atani/mysh/releases/download/${TAG}/mysh-darwin-amd64"
                sha256 "${DARWIN_AMD64_SHA}"
              else
                url "https://github.com/atani/mysh/releases/download/${TAG}/mysh-darwin-arm64"
                sha256 "${DARWIN_ARM64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/atani/mysh/releases/download/${TAG}/mysh-linux-amd64"
                sha256 "${LINUX_AMD64_SHA}"
              else
                url "https://github.com/atani/mysh/releases/download/${TAG}/mysh-linux-arm64"
                sha256 "${LINUX_ARM64_SHA}"
              end
            end

            def install
              downloaded = Dir["mysh-*"].first || "mysh"
              bin.install downloaded => "mysh"
            end

            test do
              assert_match "mysh", shell_output("#{bin}/mysh help")
            end
          end
          FORMULA
      - name: Push formula
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "Update mysh to ${{ needs.release-please.outputs.tag_name }}"
          git push

  publish-winget:
    name: Publish to winget
    needs: [release-please, build-msi]
    # Enable by setting the repository variable ENABLE_WINGET=true once the
    # WINGET_TOKEN secret and a fork of microsoft/winget-pkgs are in place.
    if: ${{ needs.release-please.outputs.release_created && vars.ENABLE_WINGET == 'true' }}
    runs-on: ubuntu-latest
    # The submission acts on the winget-pkgs fork via WINGET_TOKEN, so this job
    # needs no write access to GITHUB_TOKEN on this repository.
    permissions:
      contents: read
    steps:
      - name: Compute version
        id: ver
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Submit MSI to winget-pkgs
        uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: atani.mysh
          version: ${{ steps.ver.outputs.version }}
          release-tag: ${{ needs.release-please.outputs.tag_name }}
          installers-regex: '\.msi$'
          fork-user: atani
          token: ${{ secrets.WINGET_TOKEN }}
